name = "sherlock-backend"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# D1 — relational database
# Run: wrangler d1 create sherlock-research
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "sherlock-research"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# R2 — PDF storage
# Run: wrangler r2 bucket create sherlock-reports
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "sherlock-reports"

# Workflows — report generation pipeline
[[workflows]]
name = "sherlock-report-workflow"
binding = "REPORT_WORKFLOW"
class_name = "GenerateReportWorkflow"

# Browser Rendering — HTML to PDF
# Enable in Cloudflare dashboard → Browser Rendering
[browser]
binding = "BROWSER"

# Cron — quarterly refresh, 9am on the 1st of every 3rd month
[triggers]
crons = ["0 9 1 */3 *"]

# Secrets (set via: wrangler secret put <NAME>)
#   ANTHROPIC_API_KEY  — Claude API key for narrative generation
#   ADMIN_TOKEN        — single shared bearer token for /admin auth

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://sherlockresearch.com"

[observability]
enabled = true

# Bundle HTML templates as text imports
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
